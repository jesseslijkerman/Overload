server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Forward API calls to the api service (same origin for the browser, so no CORS needed)
  location /api/ {
    proxy_pass http://api:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Hashed build files never change, so they can be cached for a long time
  location ~* \.(?:js|css|woff2?|ico|png|svg)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Angular routes: fall back to index.html (never cached, so new builds are picked up)
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
